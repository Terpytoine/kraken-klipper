name: Build Kraken Klipper VST3

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build VST3 and curve checks
        run: cmake --build build --config Release --parallel
      - name: Run curve checks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package one-file installer
        shell: pwsh
        run: .\package-windows.ps1
      - name: Upload installer and matching source
        uses: actions/upload-artifact@v4
        with:
          name: KRAKEN-KLIPPER-Windows-Installer
          path: |
            dist/KRAKEN-KLIPPER-Setup.exe
            dist/Kraken-Klipper-Source.zip
          if-no-files-found: error
